name: CI Workflow

# trigger the workflow on push or pull request to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# test is the name of the first job in the workflow
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest streamlit pylint black mypy

    - name : Code Quality Check
      run : |
        pylint *.py

    - name : Code Formatting Check
      run : |
        black --check *.py

    - name : Type Checking
      run : |
        mypy *.py

        

    - name: Run tests
      run: |
        pytest _test.py

